name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for third-party assets
        run: tools/check_no_assets.sh

      - uses: ./.github/actions/setup

      - name: Run tests
        run: '"$GODOT" --headless --path . --script res://tests/run_tests.gd'

      # The one asset step small enough for every run: download, verify and untar Showdown's
      # npm package (17 MB), then export its data with Node. assets.yml runs the rest.
      - name: Prepare the Showdown data
        run: '"$GODOT" --headless --path . --script res://tools/assets.gd -- showdown'

  # The ruleset requires a single check named "ci"; it passes only when every platform passed.
  ci:
    name: ci
    needs: test
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every platform passed
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "test matrix: $RESULT"
          [ "$RESULT" = success ]
